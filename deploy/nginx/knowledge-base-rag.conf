server {
    listen 80 default_server;
    server_name _;

    root /var/www/knowledge-base-rag;
    index index.html;

    # The backend accepts files up to 50 MiB. Keep a little extra room for the
    # multipart/form-data envelope so Nginx does not reject valid uploads first.
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat responses use SSE, so proxy buffering must stay disabled.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
