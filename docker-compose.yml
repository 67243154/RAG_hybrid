services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: kb-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: kb-rag-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  backend:
    build: .
    container_name: kb-rag-backend
    ports:
      - "8000:8000"
    environment:
      # Original local Ollama embedding transport is retained for rollback:
      # - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - QDRANT_URL=http://qdrant:6333
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - JAEGER_PUBLIC_URL=${JAEGER_PUBLIC_URL:-http://localhost:16686}
      - GENERATION_PROVIDER=${GENERATION_PROVIDER:-deepseek}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-siliconflow}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      - SILICONFLOW_EMBED_MODEL=${SILICONFLOW_EMBED_MODEL:-Qwen/Qwen3-Embedding-4B}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-true}
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANKER_BACKEND=${RERANKER_BACKEND:-siliconflow}
      - RERANKER_CANDIDATE_K=${RERANKER_CANDIDATE_K:-20}
      - RERANKER_TOP_N=${RERANKER_TOP_N:-5}
      - SILICONFLOW_RERANK_CONNECT_TIMEOUT_SECONDS=${SILICONFLOW_RERANK_CONNECT_TIMEOUT_SECONDS:-10}
      - SILICONFLOW_RERANK_READ_TIMEOUT_SECONDS=${SILICONFLOW_RERANK_READ_TIMEOUT_SECONDS:-180}
      - SILICONFLOW_RERANK_OVERALL_TIMEOUT_SECONDS=${SILICONFLOW_RERANK_OVERALL_TIMEOUT_SECONDS:-240}
      - EMBEDDING_MODEL_KEY=${EMBEDDING_MODEL_KEY:-qwen3-4b}
      - EMBEDDING_OUTPUT_DIMENSION=${EMBEDDING_OUTPUT_DIMENSION:-1024}
      - CHUNKING_MODE=${CHUNKING_MODE:-token_aware}
      - CHUNK_TARGET_TOKENS=${CHUNK_TARGET_TOKENS:-512}
      - CHUNK_OVERLAP_TOKENS=${CHUNK_OVERLAP_TOKENS:-64}
      - CHUNK_HARD_MAX_TOKENS=${CHUNK_HARD_MAX_TOKENS:-576}
      - CHUNK_TOKENIZER_MODEL=${CHUNK_TOKENIZER_MODEL:-Qwen/Qwen3-Embedding-4B}
      - CHUNK_TOKENIZER_REVISION=${CHUNK_TOKENIZER_REVISION:-main}
      - PIPELINE_V2_CONTEXT_TOKEN_BUDGET=${PIPELINE_V2_CONTEXT_TOKEN_BUDGET:-2000}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      # The default compose stack is local development. Set APP_ENV=production
      # and provide explicit AUTH_TOKENS_JSON for a production-like deployment.
      - APP_ENV=${APP_ENV:-development}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_TOKENS_JSON=${AUTH_TOKENS_JSON:-}
      # LocalFilesystemConnector's scan root is bind-mounted separately
      # from the registry_data named volume below (non-overlapping mount
      # points — see docs/sprint-11-plan.md for why).
      - FILESYSTEM_ROOT_PATH=documents
      - FILESYSTEM_SYNC_INTERVAL_SECONDS=${FILESYSTEM_SYNC_INTERVAL_SECONDS:-300}
      # Optional — unset means the Notion connector simply isn't wired in
      # (app/wiring.py::build_connectors), same as running on the host.
      - NOTION_API_KEY=${NOTION_API_KEY:-}
    extra_hosts:
      # host.docker.internal resolves natively on Docker Desktop (macOS);
      # this makes the same compose file work on Linux hosts too.
      - "host.docker.internal:host-gateway"
    volumes:
      # Registry + sync-history SQLite file (Sprint 2/7) — opaque runtime
      # state, not something a user edits directly, so a named volume
      # rather than a bind mount (matches qdrant_storage's precedent).
      # Survives `docker compose restart`/`stop`+`start`; only removed by
      # `down -v`.
      - registry_data:/app/data
      # User-facing folder people drop real files into — a bind mount so
      # host-side edits are visible immediately, no volume indirection.
      - ./data/documents:/app/documents
      # Cross-encoder/sparse-encoder models download from HuggingFace on
      # first use (~9s+, see Sprint 5/8) — cached so `down`+`up` doesn't
      # re-download every time.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
  registry_data:
  hf_cache:
